name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go engine and bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-go vet
      - run: go mod tidy -diff

  macos:
    name: Swift and gomobile integration
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-swift-bridge
      - name: Build app and CLI through Xcode
        run: |
          for scheme in "Health XML Splitter" "XML Splitter"; do
            xcodebuild \
              -project "XML Splitter.xcodeproj" \
              -scheme "$scheme" -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/HealthXMLSplitter" \
              CODE_SIGNING_ALLOWED=NO ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          done
      - run: go mod tidy -diff
